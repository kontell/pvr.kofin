# Every-PR gate: does it compile for both Kodi versions, and does it package.
# release.yml handles tags and is the only place a release is built.
#
# The platforms are the ones Team Kodi's own add-on builder compiles for
# (xbmc/pipeline-library, vars/buildPlugin.groovy): Android armv7 and aarch64,
# macOS x86_64 and arm64, iOS, tvOS, and Windows i686, x86_64 and arm64. Linux is
# here because repository.kontell ships it; the official repository does not.
# Being listed there means being built for all of them, so a platform that only
# fails on their builder is one this workflow should have caught first.
#
# Named CI, and its jobs named for what they do, because the old arrangement had
# release.yml running the full 12-way cross-compile matrix on every pull request:
# a PR's checks were called "Linux aarch64 / Kodi 21" under a workflow called
# "Release", and the cost of a PR was a release build.
name: CI

on:
  push:
    branches: [Piers]
    # Documentation cannot break a build. Applied to pushes only: on a pull
    # request an all-ignored change reports no checks at all, which is a trap if
    # required checks are ever turned on.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

# Supersede a PR's in-flight run when it is pushed to again. With the full
# platform matrix a single PR is a dozen jobs, and on inputstream.tempo each is
# ten minutes of FFmpeg — paying twice for a superseded commit is pure waste.
# Never applied to branch pushes: those are what release tags are cut from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  app_id: pvr.kofin
  # Pinned Kodi sources. addon.xml.in's @ADDON_DEPENDS@ is filled from these
  # headers, so an unpinned ref lets the kodi.binary.instance.pvr version written
  # into the shipped addon.xml move with no commit here — and a zip can then stop
  # installing on a Kodi the user already has. drift.yml watches upstream tip
  # separately so this staying still is a decision, not neglect.
  kodi_omega_ref: "21.3-Omega"
  kodi_piers_ref: "22.0b1-Piers"

jobs:
  compile:
    # Fast feedback on the plain pinned runner: this job answers "does it build",
    # for which the ABI floor is irrelevant. The floor is exercised once per PR by
    # the package job below, which uses the same container as a release.
    name: compile (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # gcc on every push; clang as well on a pull request. This has to be an
        # expression here rather than an `if` on the job, because a job-level `if`
        # cannot read the matrix context.
        include: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"cc":"gcc","cxx":"g++"},{"cc":"clang","cxx":"clang++"}]')
          || fromJSON('[{"cc":"gcc","cxx":"g++"}]') }}
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint

      - name: Register addon
        shell: bash
        run: |
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${{ github.workspace }}/${app_id}" \
            > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake \
            -B ${app_id}/build \
            -DADDONS_TO_BUILD=${app_id} \
            -DADDON_SRC_PREFIX=${{ github.workspace }} \
            -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
            -DPACKAGE_ZIP=1 \
            ${{ github.workspace }}/xbmc/cmake/addons

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

  compile-tip:
    # Informational: it never blocks a merge. Everything else here builds against
    # the pinned tag, so that what ships is reproducible. The official
    # repository's builder does not use that pin; it compiles against the head of
    # an xbmc branch, and for Kodi 22 that branch is Piers. This job answers
    # whether it would still succeed today. A failure means upstream moved, which
    # is a decision about the pin (drift.yml watches the same thing weekly), not a
    # defect in the pull request.
    if: github.event_name == 'pull_request'
    name: compile (xbmc ${{ matrix.tip }} tip, unpinned)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tip: Piers, kodi: 22 }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi at tip
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.tip }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint

      - name: Configure and build
        run: |
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${{ github.workspace }}/${app_id}" \
            > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
          cmake \
            -B ${app_id}/build \
            -DADDONS_TO_BUILD=${app_id} \
            -DADDON_SRC_PREFIX=${{ github.workspace }} \
            -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
            -DPACKAGE_ZIP=1 \
            ${{ github.workspace }}/xbmc/cmake/addons
          make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

  compile-windows:
    # Pull requests only. A push to this branch is normally the merge of a PR
    # whose checks already ran against the merge ref, and release.yml rebuilds
    # every platform on the tag — so the merge-time repeat is redundant.
    if: github.event_name == 'pull_request'
    name: compile (${{ matrix.toolset }}, ${{ matrix.channel }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: Piers, kodi: 22, toolset: msvc, cmake_extra: "" }
          # The Windows Store build. Nothing serves a zip of it, so it is only
          # compiled; upstream add-ons carry the same check in their Azure
          # pipeline, with these two arguments.
          - { channel: Piers, kodi: 22, toolset: "msvc uwp", cmake_extra: "-DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0.22621.0" }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          # pwd -W gives a forward-slash Windows path, so CMake args survive
          # bash's backslash-escape processing.
          WS="$(pwd -W)"
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${WS}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
          cmake \
            -B "${app_id}/build" \
            -G "Visual Studio 17 2022" -A x64 -T host=x64 \
            ${{ matrix.cmake_extra }} \
            -DADDONS_TO_BUILD="${app_id}" \
            -DADDON_SRC_PREFIX="${WS}" \
            -DADDONS_DEFINITION_DIR="${WS}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${WS}/output" \
            -DPACKAGE_ZIP=1 \
            "${WS}/xbmc/cmake/addons"
          cmake --build "${app_id}/build" --config Release --target "${app_id}"

  # Every artifact a release produces, built the same way. Previously this was
  # one linux-x86_64 zip, which left armv7, aarch64 and Android — the NDK path
  # especially — entirely unbuilt until release time. The cross-builds are
  # 45-110s each on pvr.kofin, so the coverage is close to free there.
  #
  # The Linux, Android and Windows x86_64 entries below are copied from
  # release.yml and checked against it, so a platform added to one cannot
  # silently be missing from the other. Windows i686 and arm64, and everything in
  # package-apple, are built here and not released: they are the rest of the
  # official repository's matrix, and repository.kontell does not carry them.
  package-linux:
    # Pull requests only. A push to this branch is normally the merge of a PR
    # whose checks already ran against the merge ref, and release.yml rebuilds
    # every platform on the tag — so the merge-time repeat is redundant.
    if: github.event_name == 'pull_request'
    name: package (${{ matrix.os }} ${{ matrix.arch }}, ${{ matrix.channel }})
    runs-on: ubuntu-24.04
    container:
      # The ABI floor is pinned here rather than by the runner label: labels get
      # retired (ubuntu-22.04 deprecates from 2026-09-17, unsupported 2027-04-17)
      # and the floor is a property of the build host's headers, not of this code.
      # ci.yml's package job carries the full reasoning and the measurements.
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, channel: Piers, kodi: 22 }
          - { os: linux, arch: armv7, channel: Piers, kodi: 22, cross_pkgs: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf" }
          - { os: linux, arch: aarch64, channel: Piers, kodi: 22, cross_pkgs: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu" }
          - { os: android, arch: armv7, channel: Piers, kodi: 22 }
          - { os: android, arch: aarch64, channel: Piers, kodi: 22 }
    steps:
      - name: Install toolchain
        # Ahead of checkout so actions/checkout finds git and clones, rather than
        # silently falling back to the REST tarball.
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip wget ca-certificates \
            autopoint autoconf automake libtool m4 pkg-config python3 \
            binutils file ${{ matrix.cross_pkgs }}
          gcc --version | head -1
          ldd --version | head -1

      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Android NDK
        if: matrix.os == 'android'
        id: setup-ndk
        run: |
          set -eux
          NDK_VERSION=r25c
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm /tmp/ndk.zip
          fi
          echo "ndk-path=$NDK_DIR" >> $GITHUB_OUTPUT

      - name: Build
        env:
          # Static C++ runtime on Linux so the .so depends only on glibc, not on
          # a GLIBCXX_3.4.x the target lacks. The superbuild forwards
          # CMAKE_C/CXX_FLAGS but not linker flags, hence LDFLAGS. Empty on
          # Android: the NDK supplies its own STL and these are GCC/Linux flags.
          LDFLAGS: ${{ matrix.os == 'linux' && '-static-libstdc++ -static-libgcc' || '' }}
        # Relative to the job's working directory, NOT ${{ github.workspace }}.
        # In a container job that expression yields the *host* path
        # (/home/runner/work/...), while the workspace is bind-mounted at
        # /__w/... — so the absolute form resolves to nothing and the step dies
        # with exit 127. The container's workdir *is* the workspace, so relative
        # paths are correct and unambiguous.
        run: |
          ./${app_id}/scripts/build.sh \
            --os ${{ matrix.os }} \
            --arch ${{ matrix.arch }} \
            --kodi ${{ matrix.kodi }} \
            --kodi-src ./xbmc \
            ${{ matrix.os == 'android' && format('--ndk {0}', steps.setup-ndk.outputs.ndk-path) || '' }} \
            --output ./artifacts \
            --jobs $(getconf _NPROCESSORS_ONLN)

      - name: Assert the ABI floor
        # Skips Android itself (bionic has no versioned glibc symbols).
        run: |
          ./${app_id}/scripts/check-abi.sh ./artifacts "${{ env.max_glibc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-${{ matrix.os }}-${{ matrix.arch }}-pr
          retention-days: 14
          path: artifacts/*.zip
          # Not the default (warn): a job that produces no zip would otherwise
          # report success and the asset would be silently missing from the
          # release. That is exactly how inputstream.tempo v0.3.11 shipped 10
          # assets from 12 green jobs.
          if-no-files-found: error

  package-windows:
    # Pull requests only. A push to this branch is normally the merge of a PR
    # whose checks already ran against the merge ref, and release.yml rebuilds
    # every platform on the tag — so the merge-time repeat is redundant.
    if: github.event_name == 'pull_request'
    name: package (windows ${{ matrix.arch }}, ${{ matrix.channel }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # arch is the name the zip and the repository use; msvc_arch is what
          # the Visual Studio generator calls the same thing; machine is that
          # architecture's PE header value. All three are built on the x64
          # runner, the last two as cross-builds.
          - { channel: Piers, kodi: 22, arch: x86_64, msvc_arch: x64, machine: "8664" }
          - { channel: Piers, kodi: 22, arch: i686, msvc_arch: Win32, machine: "014c" }
          - { channel: Piers, kodi: 22, arch: arm64, msvc_arch: ARM64, machine: "aa64" }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          WS="$(pwd -W)"
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${WS}/${app_id}" > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

          cmake \
            -B "${app_id}/build" \
            -G "Visual Studio 17 2022" -A ${{ matrix.msvc_arch }} -T host=x64 \
            -DADDONS_TO_BUILD="${app_id}" \
            -DADDON_SRC_PREFIX="${WS}" \
            -DADDONS_DEFINITION_DIR="${WS}/xbmc/cmake/addons/addons" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${WS}/install" \
            -DPACKAGE_ZIP=1 \
            "${WS}/xbmc/cmake/addons"
          cmake --build "${app_id}/build" --config Release --target "${app_id}"

          VERSION=$(grep '^ *version=' "${app_id}/${app_id}/addon.xml.in" | head -1 | sed 's/.*version="\([^"]*\)".*/\1/')
          ZIP_NAME="${app_id}-${VERSION}-windows-${{ matrix.arch }}.zip"
          mkdir -p artifacts
          # Fail loudly if the install step produced nothing, rather than letting
          # 7z make an empty archive that upload-artifact then can't find.
          if [[ ! -d "install/${app_id}" ]]; then
            echo "::error::install/${app_id} does not exist — the install step" \
                 "produced no addon tree, so there is nothing to package." >&2
            ls -la install 2>/dev/null || true
            exit 1
          fi
          # Git Bash on windows-2022 has no `zip`; 7z is preinstalled.
          (cd install && 7z a -tzip "${WS}/artifacts/${ZIP_NAME}" "${app_id}/")
          ls -la artifacts/

      - name: Assert the DLL is for ${{ matrix.arch }}
        # A cross-build that quietly fell back to the host architecture would
        # still configure, compile, package and upload. The machine field of the
        # PE header is what says which one it is.
        shell: bash
        run: |
          set -euo pipefail
          dll="$(find "install/${app_id}" -maxdepth 1 -name '*.dll' | head -1)"
          [[ -n "$dll" ]] || { echo "::error::no DLL under install/${app_id}"; exit 1; }
          machine="$(python -c "import struct,sys; d=open(sys.argv[1],'rb').read(); o=struct.unpack_from('<I',d,0x3c)[0]; print('%04x' % struct.unpack_from('<H',d,o+4)[0])" "$dll")"
          echo "$dll: machine 0x$machine, expected 0x${{ matrix.machine }}"
          if [[ "$machine" != "${{ matrix.machine }}" ]]; then
            echo "::error::$dll is machine 0x$machine, not 0x${{ matrix.machine }} (${{ matrix.arch }})." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-windows-${{ matrix.arch }}-pr
          retention-days: 14
          path: artifacts/*.zip
          if-no-files-found: error

  package-apple:
    # Pull requests only, for the reason given on package-linux.
    #
    # One arm64 runner builds all four. Apple's toolchain cross-compiles between
    # its own architectures and platforms without help, so macOS x86_64 does not
    # need an Intel runner, and iOS and tvOS need nothing beyond the SDKs Xcode
    # already carries. build.sh writes the toolchain file, from the values
    # Kodi's own depends build uses.
    #
    # macOS is packaged. iOS and tvOS are compiled only: Kodi's builder compiles
    # add-ons for them but deploys none, so there is nothing to upload.
    if: github.event_name == 'pull_request'
    name: ${{ matrix.zip && 'package' || 'compile' }} (${{ matrix.os }} ${{ matrix.arch }}, ${{ matrix.channel }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # cpu and platform are what the built library must report: see the
          # assertion below.
          - { os: osx, arch: x86_64, channel: Piers, kodi: 22, zip: true, cpu: x86_64, platform: MACOS }
          - { os: osx, arch: arm64, channel: Piers, kodi: 22, zip: true, cpu: arm64, platform: MACOS }
          - { os: ios, arch: aarch64, channel: Piers, kodi: 22, zip: false, cpu: arm64, platform: IOS }
          - { os: tvos, arch: aarch64, channel: Piers, kodi: 22, zip: false, cpu: arm64, platform: TVOS }
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build
        run: |
          xcodebuild -version
          ./${app_id}/scripts/build.sh \
            --os ${{ matrix.os }} \
            --arch ${{ matrix.arch }} \
            --kodi ${{ matrix.kodi }} \
            --kodi-src ./xbmc \
            --output ./artifacts \
            --jobs $(sysctl -n hw.ncpu)

      - name: Assert the library is ${{ matrix.platform }} ${{ matrix.cpu }}
        # Same reason as the Windows job: every one of these is a cross-build of
        # some kind, and a library built for the runner instead of the target
        # would pass everything else here.
        run: |
          set -euo pipefail
          lib="$(find ${app_id}/build-ci-${{ matrix.os }}-${{ matrix.arch }}-kodi${{ matrix.kodi }}/install/${app_id} -maxdepth 1 -type f -name '*.dylib' | head -1)"
          [[ -n "$lib" ]] || { echo "::error::no .dylib in the install tree"; exit 1; }
          archs="$(lipo -archs "$lib")"
          build="$(xcrun vtool -show-build "$lib")"
          echo "$lib"
          echo "architectures: $archs"
          echo "$build"
          if [[ "$archs" != "${{ matrix.cpu }}" ]]; then
            echo "::error::$lib is built for '$archs', not ${{ matrix.cpu }}." >&2
            exit 1
          fi
          if ! grep -qE "platform +${{ matrix.platform }}\$" <<<"$build"; then
            echo "::error::$lib is not a ${{ matrix.platform }} binary." >&2
            exit 1
          fi

      - name: Upload artifact
        if: matrix.zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-${{ matrix.os }}-${{ matrix.arch }}-pr
          retention-days: 14
          path: artifacts/*.zip
          if-no-files-found: error
