# kontell fork only: the Linux builds repository.kontell serves.
#
# kodi-pvr/pvr.kofin is where this add-on is developed and released, and the
# official repository ships every platform except Linux. This fork's Piers branch
# is upstream's Piers plus these kontell-* workflows, which build the three Linux
# zips until distributions package the add-on themselves. build.yml (upstream's)
# covers the compile against xbmc master; this covers the pinned Kodi 22 headers
# the release is built with, and packages each zip the way a release does.
#
# Every job is gated on the repository, because a pull request from this fork to
# kodi-pvr would otherwise run these there too.
name: kontell CI

on:
  push:
    branches: [Piers]
    # Documentation cannot break a build. Applied to pushes only: on a pull
    # request an all-ignored change reports no checks at all, which is a trap if
    # required checks are ever turned on.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

# Supersede a PR's in-flight run when it is pushed to again. Never applied to
# branch pushes: those are what release tags are cut from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  app_id: pvr.kofin
  # Pinned Kodi source. addon.xml.in's @ADDON_DEPENDS@ is filled from these
  # headers, so an unpinned ref lets the kodi.binary.instance.pvr version written
  # into the shipped addon.xml move with no commit here — and a zip can then stop
  # installing on a Kodi the user already has. kontell-drift.yml watches upstream
  # so this staying still is a decision, not neglect.
  kodi_piers_ref: "22.0b1-Piers"
  # The oldest target that has to be able to load the result (CoreELEC 21.x).
  max_glibc: "2.38"

jobs:
  compile:
    # Fast feedback on the plain runner: this job answers "does it build", for
    # which the ABI floor is irrelevant. The floor is exercised by package-linux,
    # which uses the same container as a release.
    if: github.repository == 'kontell/pvr.kofin'
    name: compile (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # gcc on every push; clang as well on a pull request. This has to be an
        # expression here rather than an `if` on the job, because a job-level `if`
        # cannot read the matrix context.
        include: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"cc":"gcc","cxx":"g++"},{"cc":"clang","cxx":"clang++"}]')
          || fromJSON('[{"cc":"gcc","cxx":"g++"}]') }}
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint

      - name: Register addon
        shell: bash
        run: |
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${{ github.workspace }}/${app_id}" \
            > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake \
            -B ${app_id}/build \
            -DADDONS_TO_BUILD=${app_id} \
            -DADDON_SRC_PREFIX=${{ github.workspace }} \
            -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
            -DPACKAGE_ZIP=1 \
            ${{ github.workspace }}/xbmc/cmake/addons

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

  compile-tip:
    # Informational: it never blocks a merge. The release builds against the
    # pinned tag so that what ships is reproducible; this answers whether the
    # source still compiles against the head of xbmc's Piers branch today. A
    # failure means upstream moved, which is a decision about the pin
    # (kontell-drift.yml watches the same thing weekly), not a defect in the PR.
    if: github.repository == 'kontell/pvr.kofin' && github.event_name == 'pull_request'
    name: compile (xbmc Piers tip, unpinned)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi at tip
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: Piers
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autopoint

      - name: Configure and build
        run: |
          mkdir -p xbmc/cmake/addons/addons/${app_id}
          echo "${app_id} ${{ github.workspace }}/${app_id}" \
            > xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
          cmake \
            -B ${app_id}/build \
            -DADDONS_TO_BUILD=${app_id} \
            -DADDON_SRC_PREFIX=${{ github.workspace }} \
            -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/output \
            -DPACKAGE_ZIP=1 \
            ${{ github.workspace }}/xbmc/cmake/addons
          make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)

  # Every zip a release produces, built the same way, so a platform that fails
  # fails on the pull request and not at release time. The matrix is copied from
  # kontell-release.yml; keep the two in step.
  package-linux:
    # Pull requests only. A push to this branch is normally a merge whose checks
    # already ran, and kontell-release.yml rebuilds every zip on the tag.
    if: github.repository == 'kontell/pvr.kofin' && github.event_name == 'pull_request'
    name: package (linux ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    container:
      # The ABI floor is pinned here rather than by the runner label: labels get
      # retired and the floor is a property of the build host's headers, not of
      # this code.
      image: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64 }
          - { arch: armv7, cross_pkgs: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf" }
          - { arch: aarch64, cross_pkgs: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu" }
    steps:
      - name: Install toolchain
        # Ahead of checkout so actions/checkout finds git and clones, rather than
        # silently falling back to the REST tarball.
        run: |
          set -eux
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip wget ca-certificates \
            autopoint autoconf automake libtool m4 pkg-config python3 \
            binutils file ${{ matrix.cross_pkgs }}
          gcc --version | head -1
          ldd --version | head -1

      - name: Checkout addon
        uses: actions/checkout@v5
        with:
          path: ${{ env.app_id }}

      - name: Checkout Kodi
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.kodi_piers_ref }}
          path: xbmc
          sparse-checkout: |
            version.txt
            xbmc/interfaces/json-rpc/schema/version.txt
            cmake/
            xbmc/addons/AddonBindings.cmake
            xbmc/addons/kodi-dev-kit/include/kodi/
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build
        env:
          # Static C++ runtime so the .so depends only on glibc, not on a
          # GLIBCXX_3.4.x the target lacks. The superbuild forwards
          # CMAKE_C/CXX_FLAGS but not linker flags, hence LDFLAGS.
          LDFLAGS: -static-libstdc++ -static-libgcc
        # Relative to the job's working directory, NOT ${{ github.workspace }}.
        # In a container job that expression yields the *host* path, while the
        # workspace is bind-mounted at /__w/... — so the absolute form resolves
        # to nothing and the step dies with exit 127.
        run: |
          ./${app_id}/scripts/build.sh \
            --os linux \
            --arch ${{ matrix.arch }} \
            --kodi 22 \
            --kodi-src ./xbmc \
            --output ./artifacts \
            --jobs $(getconf _NPROCESSORS_ONLN)

      - name: Assert the ABI floor
        run: |
          ./${app_id}/scripts/check-abi.sh ./artifacts "${{ env.max_glibc }}"

      - name: Name the zip for this pull request
        # The head commit, not github.sha: on a pull request that is GitHub's
        # merge commit, which is on no branch and cannot be found in git log.
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for z in artifacts/*.zip; do
            mv "$z" "${z%.zip}-pr${PR}-${HEAD_SHA::7}.zip"
          done
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.app_id }}-linux-${{ matrix.arch }}-pr
          retention-days: 14
          path: artifacts/*.zip
          # Not the default (warn): a job that produces no zip would otherwise
          # report success.
          if-no-files-found: error
